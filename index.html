<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07142e" />
    <meta
      name="description"
      content="The Quiet Expanse — currently in development."
    />
    <title>The Quiet Expanse</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(
            ellipse at 61% 48%,
            rgba(24, 95, 176, 0.62),
            transparent 43%
          ),
          radial-gradient(
            ellipse at 12% 25%,
            rgba(13, 67, 132, 0.65),
            transparent 37%
          ),
          radial-gradient(
            ellipse at 39% 92%,
            rgba(16, 85, 165, 0.5),
            transparent 42%
          ),
          radial-gradient(
            ellipse at 93% 85%,
            rgba(18, 64, 145, 0.48),
            transparent 38%
          ),
          linear-gradient(125deg, #030a1c, #071431 55%, #030a1d);
        color: #f4f8ff;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      main {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        min-height: 100svh;
        padding: 24px;
        text-align: center;
        text-shadow: 0 2px 28px rgba(1, 5, 18, 0.9);
      }
      h1 {
        margin: 0;
        font-weight: 450;
        font-size: clamp(2rem, 6vw, 4.25rem);
        letter-spacing: 0.035em;
      }
      p {
        margin: 0;
        color: #bacde5;
        font-size: clamp(0.8rem, 1.6vw, 1rem);
        letter-spacing: 0.12em;
      }
    </style>
  </head>
  <body>
    <canvas id="stars" aria-hidden="true"></canvas>
    <main>
      <h1>The Quiet Expanse</h1>
      <p>Currently in development</p>
    </main>
    <script>
      const canvas = document.getElementById("stars");
      const ctx = canvas.getContext("2d");
      function drawStars() {
        const width = innerWidth,
          height = innerHeight;
        const dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

        // Repeatable pseudo-random stars, generated locally without image assets.
        let seed = 41283;
        function random() {
          seed = (Math.imul(seed, 1664525) + 1013904223) | 0;
          return (seed >>> 0) / 4294967296;
        }
        const count = Math.min(
          2300,
          Math.max(360, Math.round((width * height) / 690)),
        );
        for (let i = 0; i < count; i++) {
          let x = random() * width,
            y = random() * height;
          if (i % 5 === 0) {
            // A couple of denser star clusters make the sky feel less uniform.
            const cx = random() > 0.4 ? 0.6 : 0.15;
            const cy = cx === 0.6 ? 0.5 : 0.26;
            x = (cx + (random() + random() + random() - 1.5) * 0.55) * width;
            y = (cy + (random() + random() + random() - 1.5) * 0.55) * height;
          }
          if (x < 0 || x > width || y < 0 || y > height) continue;
          const bright = random() > 0.97;
          const radius = bright ? 1.2 + random() * 1.4 : 0.3 + random() * 0.65;
          const opacity = 0.25 + random() * 0.7;
          if (bright) {
            const glow = ctx.createRadialGradient(x, y, 0, x, y, radius * 7);
            glow.addColorStop(0, `rgba(120, 200, 255, ${opacity * 0.42})`);
            glow.addColorStop(1, "rgba(55, 140, 255, 0)");
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, radius * 7, 0, Math.PI * 2);
            ctx.fill();
          }
          ctx.fillStyle =
            random() > 0.35
              ? `rgba(129, 208, 255, ${opacity})`
              : `rgba(246, 250, 255, ${opacity})`;
          ctx.beginPath();
          ctx.arc(x, y, radius, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      let resizeTimer;
      addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(drawStars, 120);
      });
      drawStars();
    </script>
  </body>
</html>
